[project]
name = "autoincubator-backend"
version = "0.1.0"
description = "AutoIncubator API and worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.161.1",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "sqlalchemy[asyncio]==2.0.55",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    "arq==0.28.0",
    "redis[hiredis]==5.3.1",
    "structlog==26.1.0",
    "langgraph==1.2.16",
    "langgraph-checkpoint-postgres==3.2.0",
    "psycopg[binary]==3.3.6",
    "anthropic==2.1.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires running Postgres and Redis (docker compose up -d)"]
addopts = "-m 'not integration'"
