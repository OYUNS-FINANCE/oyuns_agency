name: autoincubator

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autoincubator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoincubator}
      POSTGRES_DB: ${POSTGRES_DB:-autoincubator}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local trace viewer (ADR 0008): `docker compose --profile tracing up -d jaeger`, then
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 and open http://localhost:16686.
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    profiles: ["tracing"]
    ports:
      - "16686:16686"   # UI and query API
      - "4318:4318"     # OTLP/HTTP

volumes:
  postgres_data:
  redis_data:
